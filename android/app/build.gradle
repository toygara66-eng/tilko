plugins {
    id "com.android.application"
}

def playCerts = (project.findProperty("TILKO_PLAY_CERT_SHA256") ?: "").toString().replace("\"", "")
def webUrl = (project.findProperty("TILKO_WEB_URL") ?: "https://localhost").toString().replace("\"", "")

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.tilko.site"
    compileSdk 36

    defaultConfig {
        applicationId "com.tilko.site"
        minSdk 24
        targetSdk 36
        versionCode 11
        versionName "1.0.10"
        buildConfigField "String", "TILKO_PLAY_CERT_SHA256", "\"${playCerts}\""
        buildConfigField "String", "TILKO_WEB_URL", "\"${webUrl}\""
        buildConfigField "String", "TILKO_PLAY_PACKAGE", "\"com.tilko.site\""
    }

    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
        release {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            debuggable false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    // Next.js static files live in _next/; aapt's default pattern drops <dir>_*.
    androidResources {
        ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(":capacitor-android")
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "com.android.billingclient:billing:8.0.0"
}

configurations.configureEach {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24"
        force "androidx.activity:activity:1.9.3"
        force "androidx.core:core:1.13.1"
        force "androidx.core:core-ktx:1.13.1"
    }
}

def capBuild = file("capacitor.build.gradle")
if (capBuild.exists()) {
    apply from: "capacitor.build.gradle"
}
