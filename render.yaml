services:
  - type: web
    name: tilko-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_FALLBACK
        value: groq
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-nano-30b-a3b:free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_SECRET
        generateValue: true
      - key: PLAY_BILLING_SANDBOX
        value: "false"
      - key: PLAY_PACKAGE_NAME
        value: com.tilko.app
      - key: CORS_ORIGINS
        value: "*"
