services:
  - type: web
    name: tilko-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_FALLBACK
        value: groq
      - key: TILKO_GEMINI_VIDEO
        value: "false"
      - key: NEBIUS_MODEL
        value: Qwen/Qwen3-32B
      - key: NEBIUS_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1/
      - key: NEBIUS_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-nano-30b-a3b:free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_MODEL
        value: gemma-4-31b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_SECRET
        generateValue: true
      - key: PLAY_BILLING_SANDBOX
        value: "false"
      - key: PLAY_PACKAGE_NAME
        value: com.tilko.app
      - key: PLAY_WEBHOOK_SECRET
        sync: false
      - key: PLAY_SERVICE_ACCOUNT_FILE
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_ANDROID_CLIENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: PUBLIC_APP_URL
        value: https://tilko.site
      - key: CORS_ORIGINS
        value: "*"
